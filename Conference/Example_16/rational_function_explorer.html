<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rational Function Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@600;700&display=swap');
        
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Strict no scrollbar constraint */
            font-family: 'Quicksand', sans-serif;
            background-color: #fdfaf6;
            color: #2d3748;
            font-size: 16px;
        }

        h1, h2, h3, .font-heading {
            font-family: 'Fredoka', sans-serif;
        }

        .card-shadow {
            box-shadow: 0 4px 15px -2px rgba(0, 0, 0, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.03);
        }

        /* Fraction styling */
        .fraction {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            text-align: center;
            padding: 0 4px;
        }
        .numerator {
            border-bottom: 2px solid currentColor;
            padding-bottom: 1px;
        }
        .denominator {
            padding-top: 1px;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 8px;
        }
    </style>
</head>
<body class="h-screen w-screen p-3 md:p-4 flex flex-col justify-between box-border gap-3">

    <!-- TOP BAR: Green Equation Box & Purple Next Equation Button -->
    <header class="w-full bg-emerald-50 border-2 border-emerald-300 rounded-2xl px-4 py-2.5 card-shadow flex items-center justify-between gap-4 shrink-0">
        <div class="flex items-center gap-3">
            <span class="w-10 h-10 rounded-xl bg-emerald-500 text-white flex items-center justify-center font-bold text-xl shadow-sm shrink-0">
                <i class="fa-solid font-mono">f</i>
            </span>
            <div>
                <h1 class="text-xs uppercase tracking-wider text-emerald-800 font-bold">Rational Function Equation</h1>
                <p class="text-xs text-emerald-600 hidden sm:block">Identify Zeros, Vertical Asymptotes, and Holes</p>
            </div>
        </div>

        <!-- Dynamic Math Equation -->
        <div id="equationDisplay" class="text-xl sm:text-2xl md:text-3xl font-bold text-emerald-950 font-mono bg-white px-5 py-1.5 rounded-xl border border-emerald-200 shadow-inner flex items-center justify-center">
            <!-- Dynamic Content -->
        </div>

        <!-- Next Equation Button -->
        <button id="nextEqBtn" onclick="generateNewFunction()" class="bg-purple-600 hover:bg-purple-700 active:bg-purple-800 text-white font-heading text-base md:text-lg font-bold px-4 py-2 rounded-xl transition shadow-md hover:shadow-lg flex items-center gap-2 shrink-0">
            <i class="fa-solid fa-arrows-rotate"></i>
            <span>Next Equation</span>
        </button>
    </header>

    <!-- MAIN DASHBOARD CONTENT AREA (Flex Fill, No Scroll) -->
    <main class="flex-1 min-h-0 w-full grid grid-cols-1 lg:grid-cols-12 gap-3 items-stretch">

        <!-- LEFT PANEL: Scaled Graph + Overlay Submit Button (7 Cols) -->
        <section class="lg:col-span-7 bg-pink-50 border-2 border-pink-200 rounded-2xl p-3 card-shadow flex flex-col justify-between relative overflow-hidden h-full">
            <div class="flex justify-between items-center mb-1.5 shrink-0">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-chart-line text-pink-600 text-lg"></i>
                    <h2 class="font-heading text-lg font-bold text-pink-900">Scaled Graph</h2>
                </div>
                <!-- Legend -->
                <div class="flex gap-3 text-xs text-slate-600 font-semibold">
                    <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-purple-600 inline-block"></span> Zero</span>
                    <span class="flex items-center gap-1"><span class="w-3 border-b-2 border-dashed border-orange-500 inline-block"></span> Asymptote</span>
                    <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full border-2 border-emerald-600 bg-white inline-block"></span> Hole</span>
                </div>
            </div>

            <!-- Canvas Container -->
            <div class="relative flex-1 w-full bg-white rounded-xl border border-pink-200 overflow-hidden shadow-inner flex items-center justify-center min-h-0">
                <canvas id="graphCanvas" class="w-full h-full cursor-crosshair"></canvas>
                <div id="canvasTooltip" class="absolute hidden bg-slate-900 text-white text-xs px-2 py-1 rounded pointer-events-none z-10 shadow-lg"></div>

                <!-- SUBMIT BUTTON: Overlaid on Bottom Right of Graph -->
                <button id="submitBtn" onclick="evaluateStudentSubmission()" 
                    class="absolute bottom-3 right-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-heading text-lg font-bold px-5 py-2.5 rounded-xl transition shadow-lg hover:shadow-xl flex items-center gap-2 z-20 border-2 border-white">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>Submit</span>
                </button>
            </div>
        </section>

        <!-- RIGHT PANEL: Simplified Control Cards (5 Cols) -->
        <section class="lg:col-span-5 flex flex-col justify-between gap-2.5 h-full overflow-hidden">

            <!-- 1. ZEROS CARD -->
            <div class="flex-1 bg-purple-50 border-2 border-purple-200 rounded-2xl p-3 card-shadow flex flex-col justify-between min-h-0">
                <div class="flex justify-between items-center mb-1">
                    <label class="font-heading text-base font-bold text-purple-900 flex items-center gap-2">
                        <i class="fa-solid fa-circle text-purple-600 text-xs"></i> Zeros
                    </label>
                    <span class="text-[11px] text-purple-700 bg-purple-100 px-2 py-0.5 rounded-md font-semibold">Numerator = 0</span>
                </div>
                <div class="flex gap-2 mb-1.5">
                    <input type="number" id="zeroInput" placeholder="x-val" min="-10" max="10" step="any"
                        class="flex-1 px-3 py-1 rounded-lg border-2 border-purple-200 focus:border-purple-500 focus:outline-none text-base">
                    <button onclick="addFeature('zeros', 'zeroInput')" 
                        class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-1 rounded-lg font-heading font-semibold text-sm transition active:scale-95">
                        Add
                    </button>
                </div>
                <div id="zerosList" class="flex-1 flex flex-wrap gap-1.5 p-1.5 bg-white rounded-lg border border-purple-100 custom-scrollbar overflow-y-auto min-h-[36px]">
                    <!-- Dynamic Badges -->
                </div>
            </div>

            <!-- 2. VERTICAL ASYMPTOTES CARD -->
            <div class="flex-1 bg-orange-50 border-2 border-orange-200 rounded-2xl p-3 card-shadow flex flex-col justify-between min-h-0">
                <div class="flex justify-between items-center mb-1">
                    <label class="font-heading text-base font-bold text-orange-900 flex items-center gap-2">
                        <i class="fa-solid fa-grip-lines-vertical text-orange-600 text-xs"></i> Vertical Asymptotes
                    </label>
                    <span class="text-[11px] text-orange-700 bg-orange-100 px-2 py-0.5 rounded-md font-semibold">Denominator = 0</span>
                </div>
                <div class="flex gap-2 mb-1.5">
                    <input type="number" id="asymptoteInput" placeholder="x-val" min="-10" max="10" step="any"
                        class="flex-1 px-3 py-1 rounded-lg border-2 border-orange-200 focus:border-orange-500 focus:outline-none text-base">
                    <button onclick="addFeature('asymptotes', 'asymptoteInput')" 
                        class="bg-orange-600 hover:bg-orange-700 text-white px-4 py-1 rounded-lg font-heading font-semibold text-sm transition active:scale-95">
                        Add
                    </button>
                </div>
                <div id="asymptotesList" class="flex-1 flex flex-wrap gap-1.5 p-1.5 bg-white rounded-lg border border-orange-100 custom-scrollbar overflow-y-auto min-h-[36px]">
                    <!-- Dynamic Badges -->
                </div>
            </div>

            <!-- 3. HOLES CARD -->
            <div class="flex-1 bg-emerald-50 border-2 border-emerald-200 rounded-2xl p-3 card-shadow flex flex-col justify-between min-h-0">
                <div class="flex justify-between items-center mb-1">
                    <label class="font-heading text-base font-bold text-emerald-900 flex items-center gap-2">
                        <i class="fa-regular fa-circle text-emerald-600 text-xs"></i> Holes
                    </label>
                    <span class="text-[11px] text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-md font-semibold">Canceled Factors</span>
                </div>
                <div class="flex gap-2 mb-1.5">
                    <input type="number" id="holeInput" placeholder="x-val" min="-10" max="10" step="any"
                        class="flex-1 px-3 py-1 rounded-lg border-2 border-emerald-200 focus:border-emerald-500 focus:outline-none text-base">
                    <button onclick="addFeature('holes', 'holeInput')" 
                        class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-1 rounded-lg font-heading font-semibold text-sm transition active:scale-95">
                        Add
                    </button>
                </div>
                <div id="holesList" class="flex-1 flex flex-wrap gap-1.5 p-1.5 bg-white rounded-lg border border-emerald-100 custom-scrollbar overflow-y-auto min-h-[36px]">
                    <!-- Dynamic Badges -->
                </div>
            </div>

        </section>
    </main>

    <!-- POP-UP MODAL: Feedback & Scoring (Yellow Theme) -->
    <div id="feedbackModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden transition-opacity duration-200">
        <div class="bg-amber-50 border-4 border-amber-300 rounded-3xl p-6 max-w-xl w-full card-shadow relative space-y-4 max-h-[90vh] overflow-y-auto custom-scrollbar">
            
            <!-- Modal Header -->
            <div class="flex items-center justify-between border-b border-amber-200 pb-3">
                <div class="flex items-center gap-3">
                    <span class="w-10 h-10 rounded-full bg-amber-400 text-amber-950 flex items-center justify-center font-bold text-xl shadow-sm">
                        <i class="fa-solid fa-award"></i>
                    </span>
                    <div>
                        <h2 class="font-heading text-2xl font-bold text-amber-950">Feedback & Scoring</h2>
                        <p class="text-xs text-amber-800">Your solution breakdown</p>
                    </div>
                </div>
                <div id="modalScoreBadge" class="px-4 py-1.5 rounded-full font-heading font-bold text-lg shadow-sm">
                    <!-- Dynamic Score -->
                </div>
            </div>

            <!-- Modal Feedback Body -->
            <div id="modalFeedbackBody" class="space-y-3">
                <!-- Dynamic Content -->
            </div>

            <!-- Modal Footer Actions -->
            <div class="flex justify-end gap-3 pt-2 border-t border-amber-200">
                <button onclick="closeModal()" class="px-5 py-2.5 rounded-xl border-2 border-slate-300 font-heading font-bold text-slate-700 hover:bg-slate-100 transition">
                    Review Graph
                </button>
                <button onclick="closeModal(); generateNewFunction();" class="px-5 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-heading font-bold shadow-md transition flex items-center gap-2">
                    <i class="fa-solid fa-arrows-rotate"></i>
                    Next Problem
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentProblem = {
            numFactors: [],
            denFactors: [],
            targetZeros: [],
            targetAsymptotes: [],
            targetHoles: [],
            simplifiedFn: null
        };

        let studentState = {
            zeros: [],
            asymptotes: [],
            holes: []
        };

        window.onload = function() {
            generateNewFunction();
            setupCanvasInteraction();
            window.addEventListener('resize', drawGraph);
        };

        function generateNewFunction() {
            studentState = { zeros: [], asymptotes: [], holes: [] };
            updateTagLists();

            // Random factors between -8 and 8 (excluding 0)
            const availableNumbers = [-8, -7, -6, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 6, 7, 8];
            const getRandomVal = () => availableNumbers[Math.floor(Math.random() * availableNumbers.length)];

            // Dynamic 1, 2, or 3 linear factors for numerator and denominator
            const numCount = Math.floor(Math.random() * 3) + 1; // 1 to 3
            const denCount = Math.floor(Math.random() * 3) + 1; // 1 to 3

            let numRoots = Array.from({ length: numCount }, getRandomVal);
            let denRoots = Array.from({ length: denCount }, getRandomVal);

            // 40% chance to explicitly introduce a hole if no common factor exists naturally
            if (Math.random() < 0.4) {
                const commonHole = getRandomVal();
                numRoots[0] = commonHole;
                denRoots[0] = commonHole;
            }

            currentProblem.numFactors = numRoots;
            currentProblem.denFactors = denRoots;

            // Mathematical feature categorization
            const numSet = [...new Set(numRoots)];
            const denSet = [...new Set(denRoots)];

            currentProblem.targetHoles = numSet.filter(r => denSet.includes(r)).sort((a,b) => a-b);
            currentProblem.targetZeros = numSet.filter(r => !denSet.includes(r)).sort((a,b) => a-b);
            currentProblem.targetAsymptotes = denSet.filter(r => !numSet.includes(r)).sort((a,b) => a-b);

            // Simplified evaluation function (canceling holes for visual plotting)
            currentProblem.simplifiedFn = (x) => {
                let num = currentProblem.targetZeros.reduce((acc, r) => acc * (x - r), 1);
                let den = currentProblem.targetAsymptotes.reduce((acc, r) => acc * (x - r), 1);
                return den === 0 ? NaN : num / den;
            };

            renderEquationHTML();
            drawGraph();
        }

        function renderEquationHTML() {
            const formatFactor = (r) => (r > 0 ? `(x - ${r})` : `(x + ${Math.abs(r)})`);

            const numStr = currentProblem.numFactors.map(formatFactor).join('');
            const denStr = currentProblem.denFactors.map(formatFactor).join('');

            document.getElementById('equationDisplay').innerHTML = `
                <span class="mr-2 text-emerald-800">f(x) =</span>
                <div class="fraction">
                    <span class="numerator">${numStr}</span>
                    <span class="denominator">${denStr}</span>
                </div>
            `;
        }

        function addFeature(type, inputId) {
            const inputEl = document.getElementById(inputId);
            const val = parseFloat(inputEl.value);

            if (isNaN(val)) return;
            const roundedVal = Math.round(val * 10) / 10;

            if (!studentState[type].includes(roundedVal)) {
                studentState[type].push(roundedVal);
                studentState[type].sort((a, b) => a - b);
                updateTagLists();
                drawGraph();
            }

            inputEl.value = '';
            inputEl.focus();
        }

        function removeFeature(type, val) {
            studentState[type] = studentState[type].filter(item => item !== val);
            updateTagLists();
            drawGraph();
        }

        function updateTagLists() {
            const styles = {
                zeros: 'bg-purple-100 text-purple-800 border-purple-300',
                asymptotes: 'bg-orange-100 text-orange-800 border-orange-300',
                holes: 'bg-emerald-100 text-emerald-800 border-emerald-300'
            };

            ['zeros', 'asymptotes', 'holes'].forEach(type => {
                const listEl = document.getElementById(`${type}List`);
                if (studentState[type].length === 0) {
                    listEl.innerHTML = `<span class="text-xs text-slate-400 italic py-0.5 px-1">None added</span>`;
                    return;
                }

                listEl.innerHTML = studentState[type].map(val => `
                    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold border ${styles[type]} shadow-sm">
                        x = ${val}
                        <button onclick="removeFeature('${type}', ${val})" class="hover:text-red-600 transition font-bold leading-none">&times;</button>
                    </span>
                `).join('');
            });
        }

        function drawGraph() {
            const canvas = document.getElementById('graphCanvas');
            const ctx = canvas.getContext('2d');

            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

            const width = rect.width;
            const height = rect.height;
            ctx.clearRect(0, 0, width, height);

            const xMin = -10, xMax = 10;

            // Auto-scale Y Limits
            let yValues = [];
            for (let x = xMin; x <= xMax; x += 0.05) {
                if (!currentProblem.targetAsymptotes.some(a => Math.abs(x - a) < 0.2)) {
                    let y = currentProblem.simplifiedFn(x);
                    if (!isNaN(y) && isFinite(y) && Math.abs(y) < 50) yValues.push(y);
                }
            }

            let yMin = -6, yMax = 6;
            if (yValues.length > 0) {
                yValues.sort((a, b) => a - b);
                let p5 = yValues[Math.floor(yValues.length * 0.05)] || -6;
                let p95 = yValues[Math.floor(yValues.length * 0.95)] || 6;
                let bound = Math.min(Math.max(Math.abs(p5), Math.abs(p95), 4), 18);
                yMin = -bound * 1.25;
                yMax = bound * 1.25;
            }

            const toCanvasX = (x) => ((x - xMin) / (xMax - xMin)) * width;
            const toCanvasY = (y) => height - ((y - yMin) / (yMax - yMin)) * height;

            // Draw Cartesian Grid
            ctx.strokeStyle = '#f1f5f9';
            ctx.lineWidth = 1;
            for (let x = Math.ceil(xMin); x <= Math.floor(xMax); x++) {
                ctx.beginPath(); ctx.moveTo(toCanvasX(x), 0); ctx.lineTo(toCanvasX(x), height); ctx.stroke();
            }
            for (let y = Math.ceil(yMin); y <= Math.floor(yMax); y++) {
                ctx.beginPath(); ctx.moveTo(0, toCanvasY(y)); ctx.lineTo(width, toCanvasY(y)); ctx.stroke();
            }

            // Axes
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, toCanvasY(0)); ctx.lineTo(width, toCanvasY(0)); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(toCanvasX(0), 0); ctx.lineTo(toCanvasX(0), height); ctx.stroke();

            // Ticks
            ctx.fillStyle = '#64748b'; ctx.font = '11px Quicksand'; ctx.textAlign = 'center';
            for (let x = -8; x <= 8; x += 2) if (x !== 0) ctx.fillText(x, toCanvasX(x), toCanvasY(0) + 14);

            // Curve Plotting
            ctx.strokeStyle = '#0284c7'; ctx.lineWidth = 3;
            ctx.beginPath();
            let isDrawing = false;
            const res = width * 2;

            for (let i = 0; i <= res; i++) {
                let px = (i / res) * width;
                let x = xMin + (i / res) * (xMax - xMin);

                if (currentProblem.targetAsymptotes.some(a => Math.abs(x - a) < 0.15)) {
                    isDrawing = false;
                    continue;
                }

                let y = currentProblem.simplifiedFn(x);
                if (isNaN(y) || !isFinite(y) || y < yMin - 10 || y > yMax + 10) {
                    isDrawing = false;
                } else {
                    let py = toCanvasY(y);
                    if (!isDrawing) { ctx.moveTo(px, py); isDrawing = true; }
                    else { ctx.lineTo(px, py); }
                }
            }
            ctx.stroke();

            // Draw Student Features
            // Vertical Asymptotes (Dashed lines)
            studentState.asymptotes.forEach(xVal => {
                const cx = toCanvasX(xVal);
                ctx.save();
                ctx.strokeStyle = '#f97316';
                ctx.lineWidth = 2.5;
                ctx.setLineDash([5, 5]);
                ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, height); ctx.stroke();
                ctx.restore();
            });

            // Zeros (Solid Purple Dots)
            studentState.zeros.forEach(xVal => {
                ctx.beginPath();
                ctx.arc(toCanvasX(xVal), toCanvasY(0), 6.5, 0, Math.PI * 2);
                ctx.fillStyle = '#9333ea'; ctx.fill();
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
            });

            // Holes (Hollow Green Circles)
            studentState.holes.forEach(xVal => {
                const yVal = currentProblem.simplifiedFn(xVal);
                const cy = isNaN(yVal) ? toCanvasY(0) : toCanvasY(yVal);
                ctx.beginPath();
                ctx.arc(toCanvasX(xVal), cy, 6.5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff'; ctx.fill();
                ctx.strokeStyle = '#059669'; ctx.lineWidth = 3; ctx.stroke();
            });
        }

        function setupCanvasInteraction() {
            const canvas = document.getElementById('graphCanvas');
            const tooltip = document.getElementById('canvasTooltip');

            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                const xVal = Math.round((-10 + (e.clientX - rect.left) / rect.width * 20) * 2) / 2;
                tooltip.style.left = `${e.clientX - rect.left + 12}px`;
                tooltip.style.top = `${e.clientY - rect.top - 12}px`;
                tooltip.classList.remove('hidden');
                tooltip.innerHTML = `x = ${xVal}`;
            });

            canvas.addEventListener('mouseleave', () => tooltip.classList.add('hidden'));
        }

        function evaluateStudentSubmission() {
            const targetZ = currentProblem.targetZeros;
            const targetA = currentProblem.targetAsymptotes;
            const targetH = currentProblem.targetHoles;

            const evaluateCat = (user, target) => ({
                correct: user.filter(v => target.includes(v)),
                extra: user.filter(v => !target.includes(v)),
                missed: target.filter(v => !user.includes(v)),
                isPerfect: user.filter(v => !target.includes(v)).length === 0 && target.filter(v => !user.includes(v)).length === 0
            });

            const zEval = evaluateCat(studentState.zeros, targetZ);
            const aEval = evaluateCat(studentState.asymptotes, targetA);
            const hEval = evaluateCat(studentState.holes, targetH);

            const totalTargets = targetZ.length + targetA.length + targetH.length;
            const totalCorrect = zEval.correct.length + aEval.correct.length + hEval.correct.length;
            const totalPenalties = zEval.extra.length + aEval.extra.length + hEval.extra.length;

            let score = Math.max(0, Math.round(((totalCorrect - (totalPenalties * 0.5)) / (totalTargets || 1)) * 100));
            if (zEval.isPerfect && aEval.isPerfect && hEval.isPerfect) score = 100;

            // Score Badge in Modal
            const badge = document.getElementById('modalScoreBadge');
            badge.className = 'px-4 py-1.5 rounded-full font-heading font-bold text-lg shadow-sm ';
            if (score === 100) badge.className += 'bg-emerald-100 text-emerald-800';
            else if (score >= 60) badge.className += 'bg-amber-200 text-amber-900';
            else badge.className += 'bg-red-100 text-red-800';
            badge.innerHTML = `${score}% Score`;

            // Modal Body HTML
            const renderRow = (title, data, targets) => `
                <div class="bg-white p-3 rounded-xl border border-amber-200 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="font-heading font-bold text-slate-800">${title}:</span>
                            ${data.isPerfect 
                                ? `<span class="bg-emerald-100 text-emerald-800 text-xs px-2 py-0.5 rounded-full font-bold">Perfect</span>` 
                                : `<span class="bg-amber-100 text-amber-800 text-xs px-2 py-0.5 rounded-full font-bold">Review</span>`}
                        </div>
                        <div class="text-xs text-slate-600 mt-1">
                            Found ${data.correct.length} of ${targets.length} 
                            ${data.missed.length ? `<span class="text-red-600 font-semibold">(Missed: x = ${data.missed.join(',')})</span>` : ''}
                            ${data.extra.length ? `<span class="text-amber-600 font-semibold">(Extra: x = ${data.extra.join(',')})</span>` : ''}
                        </div>
                    </div>
                    <div class="text-xs font-mono bg-slate-50 px-2.5 py-1 rounded border border-slate-200 self-start sm:self-auto">
                        Actual: [ ${targets.length ? targets.map(v => 'x=' + v).join(', ') : 'None'} ]
                    </div>
                </div>
            `;

            document.getElementById('modalFeedbackBody').innerHTML = `
                ${renderRow('Zeros', zEval, targetZ)}
                ${renderRow('Vertical Asymptotes', aEval, targetA)}
                ${renderRow('Holes', hEval, targetH)}

                <div class="bg-amber-100/70 p-3 rounded-xl border border-amber-300 text-xs text-amber-950 space-y-1">
                    <strong class="font-heading text-sm text-amber-900 block"><i class="fa-solid fa-lightbulb text-amber-600 mr-1"></i> Quick Rules:</strong>
                    <p>• <strong>Holes:</strong> Roots that cancel in both numerator and denominator.</p>
                    <p>• <strong>Vertical Asymptotes:</strong> Remaining roots in denominator.</p>
                    <p>• <strong>Zeros:</strong> Remaining roots in numerator.</p>
                </div>
            `;

            document.getElementById('feedbackModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('feedbackModal').classList.add('hidden');
        }
    </script>
</body>
</html>
