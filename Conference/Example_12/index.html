<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Cycle Memory Match Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%);
            min-height: 100vh;
        }

        /* 3D Card Flip Effects */
        .perspective-1000 {
            perspective: 1000px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        /* Custom Wave Animation for background polish */
        @keyframes wave {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .animate-wave {
            animation: wave 3s ease-in-out infinite;
        }

        /* Pulse highlight for matched cards */
        @keyframes matchedPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .card.matched .card-inner {
            animation: matchedPulse 0.4s ease-out;
        }

        /* Fallback SVG Icon styling when image isn't loaded */
        .fallback-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0.5rem;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen text-slate-800 antialiased selection:bg-sky-500 selection:text-white">

    <!-- Header Section -->
    <header class="w-full pt-6 pb-4 px-4 text-center">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 bg-white/80 backdrop-blur-md p-4 sm:p-6 rounded-2xl shadow-lg border border-white/50">
            <div class="flex items-center gap-3 text-left">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-sky-500 to-cyan-400 flex items-center justify-center text-white text-2xl shadow-md animate-wave">
                    💧
                </div>
                <div>
                    <h1 class="text-2xl sm:text-3xl font-extrabold bg-gradient-to-r from-sky-600 to-cyan-600 bg-clip-text text-transparent">
                        Water Cycle Match
                    </h1>
                    <p class="text-xs sm:text-sm text-slate-500 font-medium">Match vocabulary terms with their illustrations!</p>
                </div>
            </div>

            <!-- Stats Bar -->
            <div class="flex items-center gap-4 sm:gap-6 bg-sky-50/80 px-4 py-2.5 rounded-xl border border-sky-100">
                <div class="text-center">
                    <span class="block text-xs uppercase tracking-wider text-sky-600 font-bold">Moves</span>
                    <span id="move-counter" class="text-xl font-black text-slate-700">0</span>
                </div>
                <div class="h-8 w-px bg-sky-200"></div>
                <div class="text-center">
                    <span class="block text-xs uppercase tracking-wider text-sky-600 font-bold">Matches</span>
                    <span id="match-counter" class="text-xl font-black text-slate-700">0 / 8</span>
                </div>
                <div class="h-8 w-px bg-sky-200"></div>
                <div class="text-center">
                    <span class="block text-xs uppercase tracking-wider text-sky-600 font-bold">Time</span>
                    <span id="timer" class="text-xl font-black text-slate-700">00:00</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <button id="mute-btn" class="p-3 bg-white hover:bg-slate-50 text-slate-600 hover:text-slate-800 rounded-xl shadow-md border border-slate-200 transition-all flex items-center justify-center" title="Mute Sound">
                    <span id="mute-icon" class="text-lg">🔊</span>
                </button>
                <button id="reset-btn" class="flex-1 sm:flex-initial px-5 py-3 bg-gradient-to-r from-sky-500 to-cyan-500 hover:from-sky-600 hover:to-cyan-600 text-white font-bold rounded-xl shadow-md hover:shadow-lg transition-all transform active:scale-95 flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    New Game
                </button>
            </div>
        </div>
    </header>

    <!-- Main Game Board -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex items-center justify-center">
        <div id="game-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4 w-full max-w-3xl aspect-square sm:aspect-auto">
            <!-- 16 Cards will be dynamically inserted here -->
        </div>
    </main>

    <!-- Win Overlay Modal -->
    <div id="win-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full text-center shadow-2xl transform scale-90 transition-transform duration-300 border border-sky-100" id="win-modal-content">
            <div class="w-20 h-20 bg-sky-100 text-sky-500 rounded-full flex items-center justify-center mx-auto text-4xl mb-4 shadow-inner">
                🎉
            </div>
            <h2 class="text-3xl font-extrabold text-slate-800 mb-2">Splashtastic Victory!</h2>
            <p class="text-slate-600 text-sm mb-6">You've successfully mastered the water cycle concepts!</p>
            
            <div class="grid grid-cols-2 gap-3 bg-sky-50 p-4 rounded-2xl mb-6 text-slate-700">
                <div class="bg-white p-3 rounded-xl shadow-sm border border-sky-100/60">
                    <span class="text-xs text-slate-400 font-semibold block">Total Moves</span>
                    <span id="final-moves" class="text-2xl font-black text-sky-600">0</span>
                </div>
                <div class="bg-white p-3 rounded-xl shadow-sm border border-sky-100/60">
                    <span class="text-xs text-slate-400 font-semibold block">Time Spent</span>
                    <span id="final-time" class="text-2xl font-black text-sky-600">00:00</span>
                </div>
            </div>

            <button id="modal-reset-btn" class="w-full py-3.5 bg-gradient-to-r from-sky-500 to-cyan-500 text-white font-bold rounded-xl shadow-lg hover:from-sky-600 hover:to-cyan-600 transition-all transform active:scale-95">
                Play Again
            </button>
        </div>
    </div>

    <script>
        // Data structure for the 8 Water Cycle concepts
        const WATER_CYCLE_DATA = [
            {
                id: 1,
                concept: "Evaporation",
                img: "pic_1.png",
                svgIcon: `<svg class="w-10 h-10 text-sky-500 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>`
            },
            {
                id: 2,
                concept: "Condensation",
                img: "pic_2.png",
                svgIcon: `<svg class="w-10 h-10 text-sky-500 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg>`
            },
            {
                id: 3,
                concept: "Precipitation",
                img: "pic_3.png",
                svgIcon: `<svg class="w-10 h-10 text-sky-500 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>`
            },
            {
                id: 4,
                concept: "Transpiration",
                img: "pic_4.png",
                svgIcon: `<svg class="w-10 h-10 text-emerald-500 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>`
            },
            {
                id: 5,
                concept: "Accumulation (Collection)",
                img: "pic_5.png",
                svgIcon: `<svg class="w-10 h-10 text-cyan-500 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>`
            },
            {
                id: 6,
                concept: "Runoff",
                img: "pic_6.png",
                svgIcon: `<svg class="w-10 h-10 text-blue-500 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>`
            },
            {
                id: 7,
                concept: "Groundwater",
                img: "pic_7.png",
                svgIcon: `<svg class="w-10 h-10 text-amber-600 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4"></path></svg>`
            },
            {
                id: 8,
                concept: "Water Vapor",
                img: "pic_8.png",
                svgIcon: `<svg class="w-10 h-10 text-sky-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>`
            }
        ];

        // State Variables
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let gameTimer = null;
        let secondsElapsed = 0;
        let isLockGrid = false;
        let timerStarted = false;
        let isMuted = false;

        // Audio Effects (Synthesized using Web Audio API)
        const playSound = (type) => {
            if (isMuted) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'flip') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'match') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2); // G5
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.35);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.35);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.connect(g);
                        g.connect(ctx.destination);
                        o.frequency.value = freq;
                        g.gain.setValueAtTime(0.15, ctx.currentTime + idx * 0.12);
                        g.gain.linearRampToValueAtTime(0.01, ctx.currentTime + idx * 0.12 + 0.25);
                        o.start(ctx.currentTime + idx * 0.12);
                        o.stop(ctx.currentTime + idx * 0.12 + 0.25);
                    });
                }
            } catch(e) {
                // Audio context fallback if muted/unsupported
            }
        };

        // DOM Element References
        const gameGrid = document.getElementById('game-grid');
        const moveCounterEl = document.getElementById('move-counter');
        const matchCounterEl = document.getElementById('match-counter');
        const timerEl = document.getElementById('timer');
        const resetBtn = document.getElementById('reset-btn');
        const muteBtn = document.getElementById('mute-btn');
        const muteIcon = document.getElementById('mute-icon');
        const modalResetBtn = document.getElementById('modal-reset-btn');
        const winModal = document.getElementById('win-modal');
        const winModalContent = document.getElementById('win-modal-content');
        const finalMovesEl = document.getElementById('final-moves');
        const finalTimeEl = document.getElementById('final-time');

        // Initialize Game Cards Deck
        function generateDeck() {
            const deck = [];
            WATER_CYCLE_DATA.forEach((item, index) => {
                // Word Card
                deck.push({
                    id: `word-${item.id}`,
                    conceptId: item.id,
                    type: 'word',
                    text: item.concept,
                    alt: item.concept
                });
                // Image Card
                deck.push({
                    id: `img-${item.id}`,
                    conceptId: item.id,
                    type: 'image',
                    imgSrc: item.img,
                    alt: item.concept,
                    svgIcon: item.svgIcon
                });
            });
            return shuffleArray(deck);
        }

        // Fisher-Yates Shuffle Algorithm
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Timer Functions
        function startTimer() {
            if (timerStarted) return;
            timerStarted = true;
            secondsElapsed = 0;
            clearInterval(gameTimer);
            gameTimer = setInterval(() => {
                secondsElapsed++;
                const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
                const secs = (secondsElapsed % 60).toString().padStart(2, '0');
                timerEl.textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(gameTimer);
            timerStarted = false;
        }

        // Render Board
        function renderBoard() {
            gameGrid.innerHTML = '';
            cards.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card perspective-1000 h-28 sm:h-36 md:h-40 cursor-pointer select-none';
                cardEl.dataset.index = index;

                let cardBackHTML = '';
                if (card.type === 'word') {
                    // Styled Word Card
                    cardBackHTML = `
                        <div class="card-back bg-gradient-to-br from-sky-500 to-blue-600 text-white p-3 shadow-lg border-2 border-white/20 text-center flex flex-col justify-center items-center">
                            <span class="text-xs uppercase font-extrabold tracking-widest text-sky-200 mb-1 opacity-80">Vocabulary</span>
                            <span class="text-base sm:text-lg font-extrabold leading-tight drop-shadow-sm">${card.text}</span>
                        </div>
                    `;
                } else {
                    // Styled Image Card with fallback handling
                    cardBackHTML = `
                        <div class="card-back bg-white p-2 sm:p-3 shadow-lg border-2 border-sky-200 text-slate-700 text-center flex flex-col justify-center items-center overflow-hidden">
                            <img src="${card.imgSrc}" 
                                 alt="${card.alt}" 
                                 class="w-full h-full object-contain rounded-lg"
                                 onerror="this.onerror=null; this.style.display='none'; this.nextElementSibling.style.display='flex';" />
                            <div class="fallback-container hidden w-full h-full flex-col items-center justify-center bg-sky-50 rounded-lg border border-dashed border-sky-300 p-1">
                                ${card.svgIcon}
                                <span class="text-xs sm:text-sm font-bold text-sky-700 line-clamp-2">${card.alt}</span>
                            </div>
                        </div>
                    `;
                }

                cardEl.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front bg-gradient-to-tr from-sky-400 via-sky-300 to-cyan-300 text-white shadow-md border-2 border-white/40 hover:brightness-105 transition-all">
                            <div class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-sm flex items-center justify-center font-black text-lg text-white/90 shadow-inner">
                                ?
                            </div>
                        </div>
                        ${cardBackHTML}
                    </div>
                `;

                cardEl.addEventListener('click', () => handleCardClick(index));
                gameGrid.appendChild(cardEl);
            });
        }

        // Handle User Card Selection
        function handleCardClick(index) {
            if (isLockGrid) return;
            const cardEl = gameGrid.children[index];
            
            // Ignore if already flipped or matched
            if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) {
                return;
            }

            startTimer();
            playSound('flip');

            // Flip Card
            cardEl.classList.add('flipped');
            flippedCards.push({ index, data: cards[index], element: cardEl });

            if (flippedCards.length === 2) {
                moves++;
                moveCounterEl.textContent = moves;
                checkMatch();
            }
        }

        // Match Evaluation
        function checkMatch() {
            isLockGrid = true;
            const [first, second] = flippedCards;

            // Matching condition: same concept ID but different card types (word vs image)
            const isMatch = (first.data.conceptId === second.data.conceptId) && (first.data.type !== second.data.type);

            if (isMatch) {
                playSound('match');
                first.element.classList.add('matched');
                second.element.classList.add('matched');
                
                matchedPairs++;
                matchCounterEl.textContent = `${matchedPairs} / 8`;
                
                flippedCards = [];
                isLockGrid = false;

                if (matchedPairs === 8) {
                    stopTimer();
                    setTimeout(triggerWin, 600);
                }
            } else {
                // Non-matching pair reset transition
                setTimeout(() => {
                    first.element.classList.remove('flipped');
                    second.element.classList.remove('flipped');
                    flippedCards = [];
                    isLockGrid = false;
                }, 1000);
            }
        }

        // Trigger Victory State
        function triggerWin() {
            playSound('win');
            finalMovesEl.textContent = moves;
            finalTimeEl.textContent = timerEl.textContent;

            winModal.classList.remove('opacity-0', 'pointer-events-none');
            winModalContent.classList.remove('scale-90');
            winModalContent.classList.add('scale-100');
        }

        // Initialize / Reset Game
        function initGame() {
            stopTimer();
            cards = generateDeck();
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            secondsElapsed = 0;
            isLockGrid = false;

            moveCounterEl.textContent = '0';
            matchCounterEl.textContent = '0 / 8';
            timerEl.textContent = '00:00';

            // Hide victory modal
            winModal.classList.add('opacity-0', 'pointer-events-none');
            winModalContent.classList.remove('scale-100');
            winModalContent.classList.add('scale-90');

            renderBoard();
        }

        // Event Listeners
        resetBtn.addEventListener('click', initGame);
        modalResetBtn.addEventListener('click', initGame);
        muteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            muteIcon.textContent = isMuted ? '🔇' : '🔊';
            muteBtn.title = isMuted ? 'Unmute Sound' : 'Mute Sound';
        });

        // Start game on initial load
        window.onload = function() {
            initGame();
        };
    </script>
</body>
</html>
