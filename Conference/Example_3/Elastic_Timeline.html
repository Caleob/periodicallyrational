<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elastic Timeline</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--panel2:#243248;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--accent:#38bdf8;--green:#22c55e;--amber:#eab308}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
header{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:12px 20px;background:rgba(30,41,59,.65);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
header h1{font-size:17px;margin:0;font-weight:700}
.spacer{flex:1}
button{font:inherit;cursor:pointer;border-radius:10px;padding:9px 15px;border:1px solid var(--border);background:var(--panel);color:var(--text)}
button:hover{background:var(--panel2)}
#checkBtn{background:var(--accent);border-color:var(--accent);color:#03202e;font-weight:700;box-shadow:0 0 16px rgba(56,189,248,.45)}
#checkBtn:hover{filter:brightness(1.08)}
main{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
#rail-container{flex:0 0 60%;min-height:0;position:relative;overflow:hidden}
#rail-track{position:relative;width:100%;height:100%}
#stem{position:absolute;top:50%;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--border) 6%,var(--border) 94%,transparent)}
#dock-container{flex:1 1 auto;min-height:0;border-top:1px solid var(--border);overflow:auto;position:relative}
#dock-inner{display:flex;flex-wrap:wrap;gap:16px;align-content:flex-start;justify-content:center;padding:22px;min-height:100%}
.card-slot{width:172px;touch-action:none;user-select:none;cursor:grab}
.card-slot.dragging{cursor:grabbing;position:fixed;z-index:60}
.card-slot.placed{position:absolute;left:0;top:0;transition:transform .5s cubic-bezier(.34,1.8,.64,1)}
.card-face{width:100%;min-height:64px;padding:10px 13px;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.35);font-size:13px;line-height:1.35;display:flex;align-items:center;justify-content:center;text-align:center}
.card-slot.dragging .card-face{box-shadow:0 12px 30px rgba(0,0,0,.55);opacity:.96}
.bob-pool{animation:floatBig var(--dur,6s) ease-in-out infinite;animation-delay:var(--del,0s)}
.bob-rail{animation:bobSmall calc(var(--dur,6s)*.7) ease-in-out infinite;animation-delay:var(--del,0s)}
.card-face.lis-green{border-color:var(--green);box-shadow:0 0 16px rgba(34,197,94,.55)}
.card-face.lis-amber{border-color:var(--amber);box-shadow:0 0 16px rgba(234,179,8,.55)}
@keyframes floatBig{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(var(--ax),calc(var(--ay)*-1)) rotate(var(--ar))}50%{transform:translate(calc(var(--ax)*-.6),var(--ay)) rotate(calc(var(--ar)*-1))}75%{transform:translate(calc(var(--ax)*.7),calc(var(--ay)*-.5)) rotate(calc(var(--ar)*.5))}}
@keyframes bobSmall{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.conn{position:absolute;width:2px;background:var(--border);transition:left .5s cubic-bezier(.34,1.8,.64,1),top .3s ease,height .3s ease}
.conn.lis-green{background:var(--green)}
.conn.lis-amber{background:var(--amber)}
.ghost-slot{position:absolute;border:2px dashed var(--accent);border-radius:12px;opacity:.45;pointer-events:none;transition:transform .3s ease}
#lead{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:55}
#leadPath{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 5;opacity:0;transition:opacity .15s}
.modal-backdrop{position:fixed;inset:0;background:rgba(2,6,23,.6);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:100}
.modal-backdrop.hidden{display:none}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px;width:min(540px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h2{margin:0 0 6px;font-size:17px}
.modal p{color:var(--muted);font-size:13px;margin:0 0 12px}
.modal textarea{width:100%;height:220px;background:#0b1322;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(6px);background:var(--panel);border:1px solid var(--border);padding:11px 20px;border-radius:12px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:80;max-width:80vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;top:-12px;width:8px;height:14px;z-index:200;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg);opacity:.15}}
</style>
</head>
<body>
<header>
  <h1>🕰 Elastic Timeline</h1>
  <div class="spacer"></div>
  <button id="editBtn">⚙ Edit List</button>
  <button id="resetBtn">Reset</button>
  <button id="checkBtn">Check Timeline</button>
</header>
<main>
  <div id="rail-container">
    <div id="rail-track"><div id="stem"></div></div>
  </div>
  <div id="dock-container">
    <div id="dock-inner"></div>
  </div>
</main>

<svg id="lead"><path id="leadPath"/></svg>

<div class="modal-backdrop hidden" id="modal">
  <div class="modal">
    <h2>Setup Timeline Activity</h2>
    <p>Paste each event on its own line, in the correct chronological order. Students will see them shuffled and must rebuild the sequence. Double-click a card to auto-place it once confirmed.</p>
    <textarea id="textarea" spellcheck="false"></textarea>
    <div class="row">
      <button id="closeBtn">Cancel</button>
      <button id="loadBtn">Load Activity</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const railContainer=document.getElementById('rail-container');
const railTrack=document.getElementById('rail-track');
const dockInner=document.getElementById('dock-inner');
const modal=document.getElementById('modal');
const textarea=document.getElementById('textarea');
const toastEl=document.getElementById('toast');
const editBtn=document.getElementById('editBtn');
const closeBtn=document.getElementById('closeBtn');
const loadBtn=document.getElementById('loadBtn');
const resetBtn=document.getElementById('resetBtn');
const checkBtn=document.getElementById('checkBtn');
const leadPath=document.getElementById('leadPath');

const DEFAULT_EVENTS=["The printing press is invented","The telephone is invented","The light bulb is invented","The Wright brothers achieve powered flight","The first television broadcast airs","The first personal computer is released"];
const CARD_W=172, OFFSET=52, GAP=16;

let events=[], placed=[], poolOrder=[], graded=false, drag=null;
let cardEls=new Map();
let gradedGreen=new Set(), gradedAmber=new Set();

function faceOf(el){return el.firstElementChild;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function buildCards(){
  cardEls.forEach(el=>el.remove());
  cardEls=new Map();
  events.forEach(ev=>{
    const wrap=document.createElement('div');
    wrap.className='card-slot';
    wrap.dataset.id=ev.id;
    const face=document.createElement('div');
    face.className='card-face';
    face.textContent=ev.text;
    wrap.appendChild(face);
    wrap.style.setProperty('--ax',(Math.random()*16+8)+'px');
    wrap.style.setProperty('--ay',(Math.random()*14+8)+'px');
    wrap.style.setProperty('--ar',(Math.random()*6+2)+'deg');
    wrap.style.setProperty('--dur',(4+Math.random()*3).toFixed(2)+'s');
    wrap.style.setProperty('--del',(-Math.random()*4).toFixed(2)+'s');
    wrap.addEventListener('pointerdown',onPointerDown);
    wrap.addEventListener('dblclick',onDoubleClick);
    cardEls.set(ev.id,wrap);
  });
}

function loadEvents(lines){
  events=lines.map((t,i)=>({id:i+1,text:t}));
  buildCards();
  poolOrder=shuffle(events.map(e=>e.id));
  placed=[];
  graded=false;
  renderAll();
}
function resetBoard(){
  poolOrder=shuffle(events.map(e=>e.id));
  placed=[];
  graded=false;
  renderAll();
}
function gradeClass(id){
  if(gradedGreen.has(id)) return ' lis-green';
  if(gradedAmber.has(id)) return ' lis-amber';
  return '';
}

function renderDock(){
  const poolIds=poolOrder.filter(id=>!placed.includes(id) && !(drag&&drag.id===id));
  dockInner.innerHTML='';
  poolIds.forEach(id=>{
    const el=cardEls.get(id);
    el.className='card-slot pool';
    el.style.transform='';
    faceOf(el).className='card-face bob-pool';
    dockInner.appendChild(el);
  });
}

// Chooses 1, 2 or 3 vertical rows so cards fit the width with no scrolling,
// keeping to the middle 75% of the rail unless the event count forces wider use.
function computeLayout(order){
  const n=order.length;
  const W=railContainer.clientWidth||900;
  const pmin=lv=>(CARD_W+GAP)/lv;
  let levels=1;
  if(n>1){
    for(const lv of [1,2,3]){levels=lv; if((n-1)*pmin(lv)<=W*0.75) break;}
  }
  let frac=0.75;
  const span=n>1?(n-1)*pmin(levels):0;
  if(span>W*0.75) frac=Math.min(0.96, (span/W)||0.75);
  const avail=W*frac, margin=(W-avail)/2;
  const pitch=n>1?avail/(n-1):0;
  const startX=n>1?margin:W/2;
  return {levels, items:order.map((id,i)=>({id,i,x:n>1?margin+pitch*i:startX}))};
}
function rowOffset(i,levels){
  if(levels===1) return 0;
  if(levels===2) return i%2===0?-OFFSET:OFFSET;
  return [-OFFSET,OFFSET,-OFFSET*2.1][i%3];
}

function renderRail(order){
  order=order||placed;
  railTrack.querySelectorAll('.conn,.ghost-slot').forEach(n=>n.remove());
  const {levels,items}=computeLayout(order);
  const stemY=railTrack.clientHeight/2;
  items.forEach(({id,x,i})=>{
    const off=rowOffset(i,levels), above=off<0, mag=Math.abs(off);
    if(id===null){
      const g=document.createElement('div');
      g.className='ghost-slot';
      g.style.width=CARD_W+'px';g.style.height='56px';
      const y=above?stemY-mag-56:stemY+mag;
      g.style.transform=`translate(${x-CARD_W/2}px,${y}px)`;
      railTrack.appendChild(g);
      return;
    }
    const el=cardEls.get(id);
    el.className='card-slot placed';
    railTrack.appendChild(el);
    faceOf(el).className='card-face bob-rail'+(graded?gradeClass(id):'');
    const h=el.offsetHeight||64;
    const y=above?stemY-mag-h:stemY+mag;
    el.style.transform=`translate(${x-CARD_W/2}px,${y}px)`;
    if(mag>0){
      const conn=document.createElement('div');
      conn.className='conn'+(graded?gradeClass(id):'');
      conn.style.height=mag+'px';
      conn.style.left=(x-1)+'px';
      conn.style.top=(above?stemY-mag:stemY)+'px';
      railTrack.appendChild(conn);
    }
  });
}
function renderAll(){renderDock();renderRail();}

function computeInsertIndex(pointerX){
  const {items}=computeLayout(placed);
  const railRect=railTrack.getBoundingClientRect();
  const relX=pointerX-railRect.left;
  let idx=0;
  for(const it of items){if(relX>it.x) idx++;}
  return idx;
}

function updateLead(idx){
  const preview=placed.slice(0,idx).concat([null]).concat(placed.slice(idx));
  const {items}=computeLayout(preview);
  const ghost=items.find(it=>it.id===null);
  if(!ghost||!drag) return;
  const railRect=railTrack.getBoundingClientRect();
  const tx=railRect.left+ghost.x, ty=railRect.top+railTrack.clientHeight/2;
  const r=drag.el.getBoundingClientRect();
  const x1=r.left+r.width/2, y1=r.top+r.height/2;
  leadPath.setAttribute('d',`M${x1},${y1} Q${x1},${ty} ${tx},${ty}`);
  leadPath.style.opacity=1;
}
function hideLead(){leadPath.style.opacity=0;}

function onPointerDown(e){
  const el=e.currentTarget;
  const id=+el.dataset.id;
  el.setPointerCapture(e.pointerId);
  const rect=el.getBoundingClientRect();
  const from=placed.includes(id)?'rail':'pool';
  const startIndex=placed.indexOf(id);
  if(from==='rail') placed=placed.filter(x=>x!==id);
  drag={id,el,offX:e.clientX-rect.left,offY:e.clientY-rect.top,from,startIndex,previewIndex:undefined};
  el.className='card-slot dragging';
  faceOf(el).className='card-face';
  el.style.transform='';
  el.style.left=rect.left+'px';
  el.style.top=rect.top+'px';
  document.body.appendChild(el);
  renderAll();
  window.addEventListener('pointermove',onPointerMove);
  window.addEventListener('pointerup',onPointerUp,{once:true});
}
function onPointerMove(e){
  if(!drag) return;
  drag.el.style.left=(e.clientX-drag.offX)+'px';
  drag.el.style.top=(e.clientY-drag.offY)+'px';
  const railRect=railContainer.getBoundingClientRect();
  const overRail=e.clientY>=railRect.top && e.clientY<=railRect.bottom;
  if(overRail){
    const idx=computeInsertIndex(e.clientX);
    drag.previewIndex=idx;
    renderRail(placed.slice(0,idx).concat([null]).concat(placed.slice(idx)));
    updateLead(idx);
  }else{
    drag.previewIndex=null;
    renderRail(placed);
    hideLead();
  }
}
function onPointerUp(){
  if(!drag) return;
  window.removeEventListener('pointermove',onPointerMove);
  const {id,el,from,startIndex,previewIndex}=drag;
  el.style.left='';el.style.top='';
  if(previewIndex!=null){
    placed.splice(previewIndex,0,id);
  }else if(from==='rail' && typeof previewIndex==='undefined'){
    placed.splice(Math.max(0,Math.min(startIndex,placed.length)),0,id);
  }
  graded=false;
  hideLead();
  drag=null;
  renderAll();
}

function onDoubleClick(e){
  const el=e.currentTarget;
  const id=+el.dataset.id;
  if(placed.includes(id)) return;
  const ev=events.find(x=>x.id===id);
  if(!confirm(`Place "${ev.text}" on the timeline at its correct position?`)) return;
  const idx=placed.filter(pid=>pid<id).length;
  placed.splice(idx,0,id);
  graded=false;
  renderAll();
}

function computeLIS(arr){
  const n=arr.length; if(!n) return [];
  const tailIdx=[], prev=new Array(n).fill(-1);
  for(let i=0;i<n;i++){
    const v=arr[i];
    let lo=0,hi=tailIdx.length;
    while(lo<hi){const mid=(lo+hi)>>1; if(arr[tailIdx[mid]]<v) lo=mid+1; else hi=mid;}
    if(lo>0) prev[i]=tailIdx[lo-1];
    if(lo===tailIdx.length) tailIdx.push(i); else tailIdx[lo]=i;
  }
  const res=[]; let k=tailIdx[tailIdx.length-1];
  while(k!==-1){res.push(k);k=prev[k];}
  return res.reverse();
}
function checkTimeline(){
  if(placed.length===0){showToast('Place at least one event on the timeline first.');return;}
  const lisSet=new Set(computeLIS(placed));
  gradedGreen=new Set(); gradedAmber=new Set();
  placed.forEach((id,i)=>{(lisSet.has(i)?gradedGreen:gradedAmber).add(id);});
  graded=true;
  renderAll();
  const total=events.length, correct=gradedGreen.size, remaining=total-placed.length;
  if(correct===total && remaining===0){
    showToast('🎉 Perfect! The full timeline is in order.');
    burstConfetti();
  }else{
    let msg=`${correct} of ${placed.length} placed cards are in the correct sequence.`;
    if(remaining>0) msg+=` ${remaining} still waiting in the dock.`;
    showToast(msg);
  }
}
function showToast(msg){
  toastEl.textContent=msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t=setTimeout(()=>toastEl.classList.remove('show'),4200);
}
function burstConfetti(){
  const colors=['#38bdf8','#22c55e','#eab308','#f472b6','#a78bfa'];
  for(let i=0;i<36;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.left=Math.random()*100+'vw';
    c.style.background=colors[i%colors.length];
    c.style.animationDuration=(2+Math.random()*1.4)+'s';
    c.style.transform=`rotate(${Math.random()*360}deg)`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3600);
  }
}

editBtn.onclick=()=>{textarea.value=events.map(e=>e.text).join('\n');modal.classList.remove('hidden');};
closeBtn.onclick=()=>modal.classList.add('hidden');
modal.addEventListener('click',e=>{if(e.target===modal) modal.classList.add('hidden');});
loadBtn.onclick=()=>{
  const lines=textarea.value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(lines.length<2){alert('Add at least 2 events, one per line.');return;}
  loadEvents(lines);
  modal.classList.add('hidden');
};
resetBtn.onclick=resetBoard;
checkBtn.onclick=checkTimeline;
window.addEventListener('resize',()=>renderRail());

loadEvents(DEFAULT_EVENTS);
</script>
</body>
</html>
