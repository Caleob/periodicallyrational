<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Periodically Rational</title>
  <style>
    body {
      font-family: Georgia, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, serif;
      max-width: 680px;
      margin: 80px auto;
      padding: 0 24px;
      text-align: center;
      line-height: 1.6;
      background: #fbfbf9;
      color: #222;
    }
    h1 {
      font-size: 2.8em;
      margin-bottom: 8px;
      color: #111;
    }
    p {
      color: #555;
      font-size: 1.1em;
      margin-bottom: 24px;
    }
    a.button {
      display: inline-block;
      background: #1a1a1a;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 22px;
      border-radius: 6px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      transition: background 0.2s;
    }
    a.button:hover {
      background: #333;
    }
  </style>
</head>
<body>
  <h1>404</h1>
  <h2>Page Not Found</h2>
  <p>The page or app you are looking for isn't here, or may have moved.</p>
  <a class="button" href="/">← Return to Periodically Rational Home</a>
</body>
</html>
