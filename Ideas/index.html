<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writing & Ideas — Periodically Rational</title>
  <meta name="description" content="Conference presentations, essays on STEM education, and curated reading by Caleob King.">
  <style>
    :root {
      --bg: #fbfbf9;
      --card-bg: #ffffff;
      --text: #222222;
      --muted: #5f6368;
      --border: #e0ded9;
      --accent: #1a4d80;
      --accent-hover: #123356;
      --badge-bg: #eef2f6;
      --badge-text: #204060;
    }

    * { box-sizing: border-box; }

    body {
      font-family: Georgia, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, serif;
      max-width: 780px;
      margin: 40px auto;
      padding: 0 24px;
      line-height: 1.7;
      color: var(--text);
      background: var(--bg);
    }

    .top-bar {
      margin-bottom: 24px;
    }

    .back-link {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-decoration: none;
      color: var(--accent);
      font-weight: 500;
      font-size: 0.95em;
    }

    .back-link:hover { text-decoration: underline; }

    h1 {
      font-size: 2.2em;
      margin: 0 0 6px 0;
      color: #111;
    }

    .subtitle {
      color: var(--muted);
      margin: 0 0 24px 0;
      font-style: italic;
      font-size: 1.05em;
    }

    /* Filter Bar */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .filter-btn {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.84em;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .filter-btn:hover {
      background: #f0ede6;
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px 24px;
      margin: 22px 0;
      background: var(--card-bg);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.06);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .card h2 {
      margin: 0;
      font-size: 1.3em;
      color: #111;
    }

    .badge {
      display: inline-block;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.72em;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: var(--badge-bg);
      color: var(--badge-text);
      border-radius: 4px;
      padding: 3px 8px;
    }

    .card-meta {
      font-size: 0.88em;
      color: var(--muted);
      margin-bottom: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    p {
      margin: 8px 0;
    }

    .quote-box {
      font-style: italic;
      color: #444;
      border-left: 3px solid var(--accent);
      padding: 4px 0 4px 14px;
      margin: 10px 0;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    a.button {
      display: inline-block;
      background: #1a1a1a;
      color: #ffffff;
      text-decoration: none;
      padding: 9px 16px;
      border-radius: 6px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.9em;
      font-weight: 500;
      transition: background 0.2s ease;
    }

    a.button:hover {
      background: #333333;
    }

    a.button-outline {
      display: inline-block;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      text-decoration: none;
      padding: 8px 15px;
      border-radius: 6px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.9em;
      font-weight: 500;
      transition: background 0.2s ease, color 0.2s ease;
    }

    a.button-outline:hover {
      background: rgba(26, 77, 128, 0.08);
      color: var(--accent-hover);
    }

    .empty-state {
      padding: 36px 20px;
      text-align: center;
      color: var(--muted);
      font-style: italic;
    }

    footer {
      margin-top: 48px;
      padding-top: 22px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.88em;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    footer p {
      margin: 6px 0;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="top-bar">
  <a class="back-link" href="../index.html">← Return to Periodically Rational</a>
</div>

<h1>Writing & Ideas</h1>
<p class="subtitle">Presentations, tool retrospectives, essays on pedagogy, and curated reading.</p>

<!-- Category Filter Pills -->
<div class="filter-bar" id="filter-bar">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="App Retrospective">App Retrospectives</button>
  <button class="filter-btn" data-filter="Curated Reading">Curated Reading</button>
  <button class="filter-btn" data-filter="Conference Talk">Presentations</button>
  <button class="filter-btn" data-filter="Essay">Essays</button>
</div>

<!-- Dynamic Ideas Feed -->
<div id="ideas-feed"></div>

<hr style="border: none; border-top: 1px solid var(--border); margin: 32px 0;">

<footer>
  <p><strong>Periodically Rational</strong> • Science, mathematics, and classroom inquiry by Caleob King.</p>
  <p>
    <a href="../index.html">Home</a> •
    <a href="../AboutMe/index.html">About & Contact</a> •
    <a href="../Apps/index.html">Classroom Tools</a> •
    <a href="https://github.com/Caleob" target="_blank" rel="noopener">GitHub</a>
  </p>
</footer>

<!-- Load Data Ledger -->
<script src="./posts.js"></script>

<script>
  (function() {
    const feed = document.getElementById('ideas-feed');
    const filterBar = document.getElementById('filter-bar');
    let currentFilter = 'all';

    function renderPosts() {
      if (typeof IDEAS_POSTS === 'undefined' || !Array.isArray(IDEAS_POSTS)) {
        feed.innerHTML = '<div class="empty-state">Unable to load writing feed. Please check posts.js.</div>';
        return;
      }

      // Sort posts chronologically (newest first)
      const sorted = [...IDEAS_POSTS].sort((a, b) => new Date(b.date || '1970-01-01') - new Date(a.date || '1970-01-01'));

      // Filter by type if not 'all'
      const filtered = currentFilter === 'all' 
        ? sorted 
        : sorted.filter(p => p.type === currentFilter);

      if (filtered.length === 0) {
        feed.innerHTML = '<div class="empty-state">No entries found under this topic yet. Check back soon!</div>';
        return;
      }

      feed.innerHTML = filtered.map(post => {
        let buttons = '';
        if (post.articleUrl) {
          buttons += `<a class="button" href="${post.articleUrl}">${post.actionLabel || 'Read Essay →'}</a>`;
        }
        if (post.appUrl) {
          buttons += `<a class="button-outline" href="${post.appUrl}">${post.appActionLabel || 'Launch App 🎭 →'}</a>`;
        }
        if (post.externalUrl) {
          buttons += `<a class="button" href="${post.externalUrl}" target="_blank" rel="noopener">${post.actionLabel || 'Read Source ↗'}</a>`;
        }

        const quoteHtml = post.quote ? `<div class="quote-box">"${post.quote}"</div>` : '';
        const metaHtml = post.meta ? `<div class="card-meta">${post.meta}</div>` : '';
        const btnRow = buttons ? `<div class="btn-row">${buttons}</div>` : '';

        return `
          <div class="card">
            <div class="card-header">
              <h2>${post.title}</h2>
              <span class="badge">${post.badge || post.type}</span>
            </div>
            ${metaHtml}
            ${quoteHtml}
            <p>${post.summary}</p>
            ${btnRow}
          </div>
        `;
      }).join('');
    }

    // Set up filter buttons
    filterBar.addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderPosts();
    });

    // Initial render
    renderPosts();
  })();
</script>

</body>
</html>
